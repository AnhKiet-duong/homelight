# nginx cho gallery trên VPS. Hướng dẫn: docs/trien-khai-vps.md
#   sudo cp deploy/nginx-homelight.conf /etc/nginx/sites-available/homelight
#   (đổi anh.example.com thành tên miền của bạn)
#   sudo ln -s /etc/nginx/sites-available/homelight /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d anh.example.com   # certbot tự thêm phần HTTPS (listen 443) vào file này

server {
    listen 80;
    listen [::]:80;
    server_name anh.example.com;

    # Ảnh tới 50 MB, video tới 4096 MB (VIDEO_MAX_MB). nginx mặc định chỉ nhận 1 MB
    client_max_body_size 4200m;

    location / {
        proxy_pass http://127.0.0.1:3000;   # trùng PORT trong deploy/ecosystem.config.js
        proxy_http_version 1.1;

        # BẮT BUỘC giữ X-Forwarded-For: thiếu nó, mọi request từ internet trông như
        # mở trên chính máy chủ (127.0.0.1) và ai cũng dùng được "Quên mật khẩu?"
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # https -> cookie đăng nhập có Secure
        proxy_set_header Connection        "";

        # Tải lên: chuyển thẳng vào gallery, không chép tạm ra ổ của nginx
        proxy_request_buffering off;
        # Xem / tải video gốc nhiều GB: chuyển dần, không chép cả file ra ổ tạm
        proxy_max_temp_file_size 0;

        # Video lớn: gallery cần thời gian đọc thông tin video sau khi nhận xong
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        client_body_timeout   300s;
        send_timeout          300s;
    }
}
