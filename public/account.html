<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>Tài khoản · My Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070a;
    --surface: rgba(255,255,255,.04);
    --surface-2: rgba(255,255,255,.08);
    --line: rgba(255,255,255,.09);
    --text: #f3f1ec;
    --muted: rgba(243,241,236,.56);
    --faint: rgba(243,241,236,.32);
    --gold: #ffc27a;
    --danger: #ff8a7a;
    --ok: #8fe3b0;
    --ease: cubic-bezier(.2,.8,.2,1);
    --display: "Oswald", "Arial Narrow", sans-serif;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100svh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  svg { width: 18px; height: 18px; flex: none; }
  [hidden] { display: none !important; }

  .ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .ambient i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(120px); background: var(--gold); opacity: .1; left: -20vmax; top: -10vh; }

  .nav {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) clamp(16px, 4vw, 48px) 14px;
    background: rgba(7,7,10,.62); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--gold), #fff 140%); color: #111; box-shadow: 0 6px 24px rgba(255,194,122,.45);
  }
  .brand b { font-family: var(--display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 15px; }

  .btn {
    height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap;
    transition: background .25s, border-color .25s, transform .25s var(--ease), box-shadow .25s;
  }
  .btn:hover { background: var(--surface-2); border-color: rgba(255,255,255,.2); }
  .btn:active { transform: scale(.98); }
  .btn.light { background: var(--text); color: #0b0b0d; border-color: transparent; font-weight: 600; }
  .btn.light:hover { background: #fff; box-shadow: 0 10px 40px rgba(255,194,122,.45); }
  .btn.small { height: 34px; padding: 0 14px; font-size: 13px; }
  .btn.danger:hover { border-color: rgba(255,138,122,.5); color: var(--danger); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  :is(.btn, input, select):focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  main { max-width: 880px; margin: 0 auto; padding: 40px 16px 80px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 500;
    letter-spacing: .32em; text-transform: uppercase; color: var(--gold);
  }
  .eyebrow::before { content: ""; width: 36px; height: 1px; background: currentColor; }
  h1 { margin: 12px 0 28px; font-family: var(--display); font-weight: 600; font-size: clamp(34px, 6vw, 52px); letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
  h2 { margin: 0 0 4px; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 24px; }
  .panel { padding: 26px clamp(18px, 3vw, 30px); border-radius: 22px; background: rgba(12,12,16,.6); border: 1px solid var(--line); margin-bottom: 20px; }
  .panel > p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

  .me { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 14px; }
  .me div { min-width: 120px; }
  .me span { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .me b { font-weight: 500; word-break: break-all; }

  form.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  form.row .field { flex: 1 1 180px; }
  label { display: block; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  input, select {
    width: 100%; height: 42px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit; font-size: 14px; outline: none;
  }
  select option { background: #15151a; }
  input:focus, select:focus { border-color: rgba(255,194,122,.6); background: var(--surface-2); }
  .msg { min-height: 20px; margin: 10px 0 0; font-size: 13px; color: var(--danger); }
  .msg.ok { color: var(--ok); }

  .users { margin-top: 22px; border-top: 1px solid var(--line); }
  .user { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .user .who { flex: 1 1 200px; min-width: 0; }
  .user .who b { font-weight: 500; }
  .user .who small { display: block; color: var(--faint); font-size: 12px; }
  .tag { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid rgba(255,194,122,.4); color: var(--gold); vertical-align: 2px; }
  .user .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .reset { display: flex; gap: 8px; flex: 1 1 100%; }
  .reset input { height: 34px; max-width: 260px; }
  @media (max-width: 520px) {
    .nav { gap: 8px; }
    .brand b { display: none; }
    .nav .btn { padding: 0 14px; }
  }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i></div>

<nav class="nav">
  <a class="brand" href="/">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span>
    <b>My Gallery</b>
  </a>
  <a class="btn" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    Về gallery
  </a>
  <button class="btn" id="logout">Đăng xuất</button>
</nav>

<main>
  <div class="eyebrow">Tài khoản</div>
  <h1 id="hello">Xin chào</h1>

  <section class="panel">
    <h2>Thông tin của bạn</h2>
    <div class="me">
      <div><span>Tên đăng nhập</span><b id="meName"></b></div>
      <div><span>Mã người dùng</span><b id="meId"></b></div>
      <div><span>Quyền</span><b id="meRole"></b></div>
      <div><span>Ngày tạo</span><b id="meCreated"></b></div>
    </div>
  </section>

  <section class="panel">
    <h2>Đổi mật khẩu</h2>
    <p>Sau khi đổi, các thiết bị khác đang đăng nhập sẽ bị đăng xuất.</p>
    <form class="row" id="pwForm" novalidate>
      <div class="field"><label for="pwCur">Mật khẩu hiện tại</label><input id="pwCur" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="pwNew">Mật khẩu mới</label><input id="pwNew" type="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự"></div>
      <button class="btn light" type="submit">Đổi mật khẩu</button>
    </form>
    <p class="msg" id="pwMsg" role="status"></p>
  </section>

  <section class="panel" id="admin" hidden>
    <h2>Quản lý người dùng</h2>
    <p>Mỗi người có một thư mục ảnh riêng và chỉ thấy ảnh của mình.</p>
    <form class="row" id="addForm" novalidate>
      <div class="field"><label for="addName">Tên đăng nhập</label><input id="addName" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="vd: lan.anh"></div>
      <div class="field"><label for="addPw">Mật khẩu</label><input id="addPw" type="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự"></div>
      <div class="field" style="flex:0 1 140px"><label for="addRole">Quyền</label>
        <select id="addRole"><option value="user">Người dùng</option><option value="admin">Quản trị</option></select>
      </div>
      <button class="btn light" type="submit">Thêm người dùng</button>
    </form>
    <p class="msg" id="addMsg" role="status"></p>
    <div class="users" id="users"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fmtDate = new Intl.DateTimeFormat('vi-VN', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtSize = b => b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : b < 1073741824 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1073741824).toFixed(2) + ' GB';
const roleName = r => r === 'admin' ? 'Quản trị' : 'Người dùng';
let me = null;

async function api(method, path, body) {
  const opts = { method };
  if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers = { 'Content-Type': 'application/json' }; }
  const res = await fetch(path, opts);
  if (res.status === 401) { location.href = '/login.html?next=/account.html'; throw new Error('Cần đăng nhập'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Lỗi ${res.status}`);
  return data;
}
function say(el, text, ok) { el.textContent = text; el.classList.toggle('ok', !!ok); }

$('logout').onclick = async () => {
  await api('POST', '/api/logout').catch(() => {});
  location.href = '/login.html';
};

$('pwForm').onsubmit = async e => {
  e.preventDefault();
  try {
    await api('POST', '/api/password', { current: $('pwCur').value, next: $('pwNew').value });
    $('pwForm').reset();
    say($('pwMsg'), 'Đã đổi mật khẩu.', true);
  } catch (err) { say($('pwMsg'), err.message); }
};

$('addForm').onsubmit = async e => {
  e.preventDefault();
  try {
    const u = await api('POST', '/api/users', { username: $('addName').value, password: $('addPw').value, role: $('addRole').value });
    $('addForm').reset();
    say($('addMsg'), `Đã tạo tài khoản ${u.username}.`, true);
    loadUsers();
  } catch (err) { say($('addMsg'), err.message); }
};

function userRow(u) {
  const row = document.createElement('div');
  row.className = 'user';
  const self = u.id === me.id;
  row.innerHTML = `
    <div class="who"><b></b>${u.role === 'admin' ? '<span class="tag">Quản trị</span>' : ''}
      <small></small></div>
    <div class="acts">
      <button class="btn small" data-act="reset">Đặt lại mật khẩu</button>
      ${self ? '' : `<button class="btn small" data-act="role">${u.role === 'admin' ? 'Bỏ quyền quản trị' : 'Cấp quyền quản trị'}</button>
      <button class="btn small danger" data-act="delete">Xoá</button>`}
    </div>
    <form class="reset" hidden><input type="password" placeholder="Mật khẩu mới (ít nhất 8 ký tự)" autocomplete="new-password"><button class="btn small light" type="submit">Lưu</button></form>`;
  row.querySelector('.who b').textContent = u.username + (self ? ' (bạn)' : '');
  row.querySelector('.who small').textContent = `Mã ${u.id} · ${u.photos} ảnh · ${fmtSize(u.bytes)} · tạo ${fmtDate.format(u.created)}`;
  const form = row.querySelector('.reset');
  row.querySelector('[data-act="reset"]').onclick = () => { form.hidden = !form.hidden; if (!form.hidden) form.querySelector('input').focus(); };
  form.onsubmit = async e => {
    e.preventDefault();
    try {
      await api('PATCH', '/api/users/' + u.id, { password: form.querySelector('input').value });
      form.hidden = true; form.reset();
      say($('addMsg'), `Đã đặt lại mật khẩu cho ${u.username}.`, true);
    } catch (err) { say($('addMsg'), err.message); }
  };
  const roleBtn = row.querySelector('[data-act="role"]');
  if (roleBtn) roleBtn.onclick = async () => {
    try { await api('PATCH', '/api/users/' + u.id, { role: u.role === 'admin' ? 'user' : 'admin' }); loadUsers(); }
    catch (err) { say($('addMsg'), err.message); }
  };
  const delBtn = row.querySelector('[data-act="delete"]');
  if (delBtn) delBtn.onclick = async () => {
    if (!confirm(`Xoá tài khoản ${u.username} và toàn bộ ${u.photos} ảnh của người này? Không thể hoàn tác.`)) return;
    try { await api('DELETE', '/api/users/' + u.id); say($('addMsg'), `Đã xoá ${u.username}.`, true); loadUsers(); }
    catch (err) { say($('addMsg'), err.message); }
  };
  return row;
}

async function loadUsers() {
  const list = await api('GET', '/api/users');
  $('users').replaceChildren(...list.map(userRow));
}

(async () => {
  const s = await api('GET', '/api/status');
  if (!s.user) { location.href = '/login.html?next=/account.html'; return; }
  me = s.user;
  $('hello').textContent = 'Xin chào, ' + me.username;
  $('meName').textContent = me.username;
  $('meId').textContent = me.id;
  $('meRole').textContent = roleName(me.role);
  $('meCreated').textContent = fmtDate.format(me.created);
  if (me.role === 'admin') { $('admin').hidden = false; loadUsers(); }
})();
</script>
</body>
</html>
