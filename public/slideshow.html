<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Kỷ Niệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #f5f3ee;
    --muted: rgba(245,243,238,.6);
    --faint: rgba(245,243,238,.34);
    --line: rgba(255,255,255,.12);
    --gold: #ffc27a;
    --amb: 255 194 122;
    --bar: clamp(34px, 6.5vh, 64px);   /* thanh đen điện ảnh trên/dưới */
    --ease: cubic-bezier(.2,.8,.2,1);
    --cine: cubic-bezier(.7,0,.2,1);
    --display: "Oswald", "Arial Narrow", sans-serif;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000; color: var(--text); overflow: hidden; font-family: var(--sans);
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  body.idle { cursor: none; }
  button, select { font: inherit; color: inherit; }
  svg { width: 20px; height: 20px; flex: none; }

  /* ---------- Không khí ---------- */
  .bgwrap { position: fixed; inset: 0; overflow: hidden; }
  .bgwrap i {
    position: absolute; inset: -12%; background: center / cover no-repeat;
    filter: blur(60px) saturate(1.5) brightness(.32); opacity: 0; transform: scale(1.15);
    transition: opacity 2s ease;
  }
  .bgwrap i.on { opacity: 1; }
  .glow {
    position: fixed; left: 50%; top: 46%; width: 90vmin; height: 70vmin; margin: -35vmin 0 0 -45vmin;
    border-radius: 50%; background: rgb(var(--amb)); filter: blur(110px); opacity: .28;
    transition: background-color 2s ease; pointer-events: none;
    animation: breathe 9s ease-in-out infinite alternate;
  }
  @keyframes breathe { to { transform: scale(1.18); opacity: .36; } }
  .grain {
    position: fixed; inset: -100%; width: 300%; height: 300%; z-index: 30; pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0) } 20% { transform: translate(-3%,2%) } 40% { transform: translate(2%,-3%) }
    60% { transform: translate(-2%,-1%) } 80% { transform: translate(3%,3%) } 100% { transform: translate(0,0) }
  }
  .vignette { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.7) 100%); }
  .bars i { position: fixed; left: 0; right: 0; height: var(--bar); background: #000; z-index: 20; transition: transform 1.6s var(--cine); }
  .bars .t { top: 0; } .bars .b { bottom: 0; }
  body.intro-on .bars .t { transform: translateY(-100%); }
  body.intro-on .bars .b { transform: translateY(100%); }

  /* ---------- Sân khấu 3D ---------- */
  .scene {
    position: fixed; left: 0; right: 0; top: 46%; height: 0; z-index: 5;
    perspective: 1800px; transform-style: preserve-3d;
    transition: transform 1.8s var(--ease), opacity 1.4s ease;
  }
  .scene.pre { transform: translateY(40px) scale(.7); opacity: 0; }
  .sc {
    position: absolute; left: 50%; top: 0; transform-style: preserve-3d; cursor: pointer;
    transition: transform 1.3s var(--cine), opacity 1.3s var(--cine);
    will-change: transform;
  }
  .sc.no-t { transition: none; }
  .frame {
    position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden; background: #111;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06);
    -webkit-box-reflect: below 14px linear-gradient(transparent 72%, rgba(255,255,255,.14));
    transition: filter 1.3s var(--cine), box-shadow 1.3s var(--cine);
    filter: brightness(var(--br, 1)) saturate(var(--sat, 1));
  }
  .sc.center .frame {
    box-shadow: 0 60px 140px -40px rgb(var(--c, var(--amb)) / .7), 0 0 0 1px rgba(255,255,255,.1);
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: center; }
  .frame::after { /* vệt sáng quét qua khi ảnh vào giữa */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%);
    transform: translateX(-120%);
  }
  .sc.center.shine .frame::after { animation: shine 1.6s var(--ease) .5s; }
  @keyframes shine { to { transform: translateX(120%); } }

  /* ---------- Chú thích ---------- */
  .cap, .title { position: fixed; z-index: 8; bottom: calc(var(--bar) + 26px); pointer-events: none; }
  .cap { left: clamp(20px, 5vw, 64px); }
  .title { right: clamp(20px, 5vw, 64px); text-align: right; max-width: 40vw; }
  .mask { display: block; overflow: hidden; padding: .2em 0 .06em; margin-top: -.2em; } /* chừa chỗ cho dấu tiếng Việt */
  .mask > span { display: inline-block; transform: translateY(110%); }
  .run .mask > span { animation: up 1.1s var(--ease) forwards; }
  .run .mask:nth-child(2) > span { animation-delay: .1s; }
  .run .mask:nth-child(3) > span { animation-delay: .2s; }
  @keyframes up { to { transform: none; } }
  .cap .dm { font-family: var(--display); font-weight: 600; font-size: clamp(48px, 7vw, 104px); line-height: .9; letter-spacing: -.01em; }
  .cap .dm em { font-style: normal; color: rgb(var(--amb)); transition: color 2s; }
  .cap .yr { font-family: var(--serif); font-style: italic; font-size: clamp(18px, 2vw, 26px); color: var(--muted); margin-top: 8px; }
  .title .nm { font-family: var(--display); font-weight: 500; font-size: clamp(22px, 3.2vw, 44px); text-transform: uppercase; letter-spacing: .04em; line-height: 1.05; }
  .title .fv { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }

  /* ---------- Thanh trên ---------- */
  .top {
    position: fixed; z-index: 25; top: 0; left: 0; right: 0; height: var(--bar);
    padding: env(safe-area-inset-top) clamp(14px, 3vw, 32px) 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  .back { justify-self: start; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: .06em; transition: color .2s; }
  .back:hover { color: var(--text); }
  .reel { font-size: 11px; letter-spacing: .4em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .reel b { color: var(--text); font-weight: 500; }
  .counter { justify-self: end; font-family: var(--display); font-size: 15px; letter-spacing: .1em; color: var(--faint); font-variant-numeric: tabular-nums; }
  .counter b { color: var(--text); font-weight: 500; }

  /* ---------- Điều khiển ---------- */
  .chrome { transition: opacity .6s var(--ease), transform .6s var(--ease); }
  body.idle .chrome { opacity: 0; pointer-events: none; }
  body.idle .controls { transform: translate(-50%, 14px); }
  .controls {
    position: fixed; z-index: 26; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + 22px);
    display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 999px;
    background: rgba(16,16,20,.5); border: 1px solid var(--line);
    backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .cbtn {
    width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; color: var(--text);
    display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s, transform .15s;
  }
  .cbtn:hover { background: rgba(255,255,255,.12); }
  .cbtn:active { transform: scale(.9); }
  .cbtn.on { color: var(--gold); }
  .cbtn.play { width: 52px; height: 52px; background: var(--text); color: #0b0b0d; margin: 0 4px; box-shadow: 0 8px 30px rgb(var(--amb) / .5); }
  .cbtn.play:hover { background: #fff; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
  .speed {
    height: 34px; border-radius: 999px; border: 0; padding: 0 12px; cursor: pointer; background: transparent;
    font-family: var(--display); font-size: 14px; letter-spacing: .06em; appearance: none; -webkit-appearance: none; text-align: center;
  }
  .speed:hover { background: rgba(255,255,255,.12); }
  .speed option { color: #111; }
  :is(.cbtn, .speed, .back, .start):focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .progress { position: fixed; z-index: 21; left: 0; right: 0; bottom: var(--bar); height: 2px; background: rgba(255,255,255,.07); }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, rgb(var(--amb)), #fff); transform-origin: left; transform: scaleX(0); box-shadow: 0 0 12px rgb(var(--amb)); }

  .pulse {
    position: fixed; z-index: 27; left: 50%; top: 46%; width: 96px; height: 96px; margin: -48px 0 0 -48px;
    border-radius: 50%; background: rgba(0,0,0,.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: grid; place-items: center; opacity: 0; pointer-events: none;
  }
  .pulse svg { width: 38px; height: 38px; }
  .pulse.show { animation: pulse .75s var(--ease); }
  @keyframes pulse { 0% { opacity: 0; transform: scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }
  .toast {
    position: fixed; z-index: 28; left: 50%; top: calc(var(--bar) + 16px); transform: translate(-50%, -8px); opacity: 0;
    transition: .35s var(--ease); pointer-events: none; padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: rgba(16,16,20,.65); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Intro: bức tường ảnh 3D + tiêu đề ---------- */
  .intro { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; overflow: hidden; background: #050506; }
  .intro.leave { pointer-events: none; }
  .wall-wrap { position: absolute; inset: 0; perspective: 1200px; transition: transform 1.8s var(--cine), opacity 1.6s ease; }
  .intro.leave .wall-wrap { transform: scale(1.8); opacity: 0; }
  .wall {
    position: absolute; left: 50%; top: 50%; width: 160vmax; margin-left: -80vmax;
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px;
    transform: translateY(-50%) rotateX(24deg) rotateZ(-12deg); transform-origin: center;
  }
  .wall .col { display: flex; flex-direction: column; gap: 18px; animation: scrollUp 60s linear infinite; }
  .wall .col:nth-child(even) { animation-direction: reverse; animation-duration: 75s; }
  @keyframes scrollUp { to { transform: translateY(-50%); } }
  .wall img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; display: block; filter: brightness(.55) saturate(1.1); }
  .intro::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(5,5,6,.55) 0%, rgba(5,5,6,.92) 70%); pointer-events: none; }
  .intro .content { position: relative; z-index: 1; padding: 24px; transition: transform 1.4s var(--cine), opacity 1s ease; }
  .intro.leave .content { transform: translateY(-40px) scale(.96); opacity: 0; }
  .intro.leave { opacity: 0; transition: opacity .6s ease 1.2s; }
  .eyebrow { font-size: 12px; letter-spacing: .5em; text-transform: uppercase; color: var(--gold); opacity: 0; animation: fade 1.4s ease .3s forwards; }
  .intro h1 {
    margin: 6px 0 6px; padding: .2em 0 .1em; /* chừa chỗ cho dấu tiếng Việt khi dùng chữ gradient */
    font-family: var(--display); font-weight: 700; text-transform: uppercase; line-height: 1;
    font-size: clamp(72px, 16vw, 220px); letter-spacing: .5em; margin-right: -.5em; opacity: 0; filter: blur(14px);
    animation: titleIn 2.4s var(--ease) .4s forwards;
    background: linear-gradient(180deg, #fff 35%, rgb(var(--amb)) 150%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @keyframes titleIn { to { letter-spacing: .04em; margin-right: -.04em; opacity: 1; filter: blur(0); } }
  .meta { font-family: var(--serif); font-style: italic; font-size: clamp(17px, 2vw, 22px); color: var(--muted); opacity: 0; animation: fade 1.4s ease 1.4s forwards; }
  @keyframes fade { to { opacity: 1; } }
  .start {
    position: relative; margin: 44px auto 0; width: 132px; height: 132px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
    display: grid; place-items: center; opacity: 0; animation: fade 1.2s ease 1.9s forwards;
  }
  .start[disabled] { cursor: default; }
  .start .ringtext { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 18s linear infinite; }
  .start .ringtext text { font-family: var(--sans); font-size: 9.6px; letter-spacing: 3.2px; fill: var(--muted); text-transform: uppercase; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .start .core {
    width: 76px; height: 76px; border-radius: 50%; background: var(--text); color: #0b0b0d; display: grid; place-items: center;
    box-shadow: 0 0 0 0 rgb(var(--amb) / .5), 0 16px 50px rgb(var(--amb) / .5);
    transition: transform .4s var(--ease), box-shadow .4s; animation: ping 2.4s ease-out 2.6s infinite;
  }
  .start:hover .core { transform: scale(1.08); }
  .start[disabled] .core { opacity: .35; animation: none; }
  .start .core svg { width: 26px; height: 26px; margin-left: 4px; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgb(var(--amb) / .5), 0 16px 50px rgb(var(--amb) / .5); } 100% { box-shadow: 0 0 0 26px rgb(var(--amb) / 0), 0 16px 50px rgb(var(--amb) / .5); } }
  .hint { margin-top: 30px; font-size: 12px; color: var(--faint); letter-spacing: .04em; opacity: 0; animation: fade 1s ease 2.4s forwards; }
  .hint kbd { font-family: inherit; font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,.18); color: var(--muted); }
  .intro .msg a { color: var(--gold); }

  @media (max-width: 760px) {
    .reel { display: none; }
    .top { grid-template-columns: 1fr 1fr; }
    .cap { bottom: calc(var(--bar) + 92px); }
    .title { bottom: calc(var(--bar) + 96px); max-width: 46vw; }
    .controls { gap: 0; padding: 4px; bottom: calc(var(--bar) + 16px); }
    .cbtn { width: 38px; height: 38px; }
    .cbtn.play { width: 48px; height: 48px; }
    .sep, .hide-sm { display: none; }
    .hint { display: none; }
    .wall { grid-template-columns: repeat(4, 1fr); width: 200vmax; margin-left: -100vmax; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wall .col, .grain, .glow, .start .ringtext { animation: none; }
  }
</style>
</head>
<body class="intro-on">

<div class="bgwrap"><i></i><i></i></div>
<div class="glow" id="glow"></div>
<div class="scene pre" id="scene"></div>
<div class="vignette"></div>
<div class="grain" aria-hidden="true"></div>
<div class="bars" aria-hidden="true"><i class="t"></i><i class="b"></i></div>

<div class="cap" id="cap"></div>
<div class="title" id="title"></div>

<div class="top chrome" id="topbar">
  <a class="back" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>
    Gallery
  </a>
  <div class="reel" id="reel"></div>
  <div class="counter" id="counter"></div>
</div>

<div class="controls chrome" role="toolbar" aria-label="Điều khiển trình chiếu">
  <button class="cbtn hide-sm" id="shuffleBtn" title="Trộn ngẫu nhiên (S)" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
  </button>
  <button class="cbtn" id="favBtn" title="Chỉ ảnh yêu thích" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
  </button>
  <div class="sep"></div>
  <button class="cbtn" id="prevBtn" title="Ảnh trước (←)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
  </button>
  <button class="cbtn play" id="playBtn" title="Phát / Tạm dừng (Space)"></button>
  <button class="cbtn" id="nextBtn" title="Ảnh sau (→)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
  </button>
  <div class="sep"></div>
  <select class="speed hide-sm" id="speed" title="Thời gian mỗi ảnh" aria-label="Thời gian mỗi ảnh">
    <option value="3">3s</option><option value="5">5s</option><option value="7">7s</option>
    <option value="10">10s</option><option value="15">15s</option>
  </select>
  <button class="cbtn" id="musicBtn" title="Chọn nhạc nền (M)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>
  <button class="cbtn" id="fsBtn" title="Toàn màn hình (F)"></button>
  <input type="file" id="musicFile" accept="audio/*" hidden>
</div>

<div class="progress"><i id="bar"></i></div>
<div class="pulse" id="pulse"></div>
<div class="toast" id="toast"></div>
<audio id="audio" loop></audio>

<div class="intro" id="intro">
  <div class="wall-wrap"><div class="wall" id="wall"></div></div>
  <div class="content">
    <div class="eyebrow">Một bộ sưu tập</div>
    <h1>Kỷ niệm</h1>
    <div class="meta msg" id="introText">Đang tải ảnh…</div>
    <button class="start" id="startBtn" disabled aria-label="Bắt đầu trình chiếu">
      <svg class="ringtext" viewBox="0 0 132 132" aria-hidden="true">
        <defs><path id="circ" d="M66,66 m-54,0 a54,54 0 1,1 108,0 a54,54 0 1,1 -108,0"/></defs>
        <text><textPath href="#circ">Bắt đầu trình chiếu • Bắt đầu trình chiếu •</textPath></text>
      </svg>
      <span class="core"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
    </button>
    <div class="hint"><kbd>Space</kbd> phát/dừng &nbsp; <kbd>←</kbd> <kbd>→</kbd> chuyển ảnh &nbsp; <kbd>F</kbd> toàn màn hình</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  shrink: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
};
const MOVE_MS = 1300; // thời gian băng chuyền 3D trượt sang ảnh mới

// ---------- Settings (nhớ lại lựa chọn của người xem) ----------
const params = new URLSearchParams(location.search);
const store = {
  get(k, d) { try { const v = localStorage.getItem('slideshow-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('slideshow-' + k, JSON.stringify(v)); } catch {} },
};
let seconds = store.get('speed', 5);
let shuffle = store.get('shuffle', false);
let favOnly = params.has('fav') ? params.get('fav') === '1' : store.get('fav', false);

// ---------- State ----------
let all = [], list = [], idx = 0;
let playing = false, started = false, loading = false;
let elapsed = 0, lastT = performance.now();
const colors = new Map();

const when = p => p.taken || p.added;
const fmtDay = new Intl.DateTimeFormat('vi-VN', { weekday: 'long' });
const pad = n => String(n).padStart(2, '0');
// Tên file mặc định của máy ảnh / điện thoại thì không hiện
const boringName = n => /^(img|dsc|dscn|pxl|mvimg|photo|image|screenshot|pasted|ảnh chụp)[\s_\-.\d()]/i.test(n) || /^[\d_\-\s]+\./.test(n);

function buildList(keepId) {
  let l = all.filter(p => !favOnly || p.fav).sort((a, b) => when(a) - when(b));
  if (shuffle) for (let i = l.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [l[i], l[j]] = [l[j], l[i]]; }
  list = l;
  const k = keepId ? list.findIndex(p => p.id === keepId) : -1;
  idx = k >= 0 ? k : 0;
}

// ---------- Màu chủ đạo ----------
function dominant(img) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0, 24, 24);
    const d = x.getImageData(0, 0, 24, 24).data;
    let r = 0, g = 0, b = 0, sum = 0;
    for (let i = 0; i < d.length; i += 4) {
      const max = Math.max(d[i], d[i + 1], d[i + 2]), min = Math.min(d[i], d[i + 1], d[i + 2]);
      const w = ((max - min) / 255 + .08) * (max > 40 && max < 245 ? 1 : .15);
      r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; sum += w;
    }
    return vivid(r / sum, g / sum, b / sum);
  } catch { return null; }
}
function vivid(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0, s = 0, l = (max + min) / 2;
  if (d) {
    s = l > .5 ? d / (2 - max - min) : d / (max + min);
    h = (max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4) / 6;
  }
  s = s < .08 ? .1 : Math.max(s, .5); l = Math.min(Math.max(l, .55), .66);
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1/6 ? p + (q - p) * 6 * t : t < 1/2 ? q : t < 2/3 ? p + (q - p) * (2/3 - t) * 6 : p; };
  return [f(h + 1/3), f(h), f(h - 1/3)].map(v => Math.round(v * 255)).join(' ');
}

// ---------- Tải ảnh trước để chuyển cảnh không bị giật ----------
const cache = new Map();
function preload(p) {
  if (!p) return Promise.resolve();
  if (!cache.has(p.url)) {
    const img = new Image();
    const loaded = new Promise(r => { img.onload = img.onerror = r; });
    img.src = p.url;
    // decode() giúp chuyển cảnh mượt, nhưng không để ảnh quá lớn làm treo trình chiếu
    const ready = Promise.race([
      loaded.then(() => img.decode?.()).catch(() => {}),
      new Promise(r => setTimeout(r, 4000)),
    ]);
    cache.set(p.url, ready.then(() => {
      if (img.complete && img.naturalWidth && !colors.has(p.id)) colors.set(p.id, dominant(img));
    }));
    if (cache.size > 16) cache.delete(cache.keys().next().value);
  }
  return cache.get(p.url);
}

// ---------- Băng chuyền 3D ----------
const scene = $('scene');
const cards = new Map(); // index trong list -> phần tử thẻ ảnh
const mobile = () => innerWidth < 760;

function metrics() {
  const bar = $('topbar').offsetHeight || 48;
  const top = bar + 30, bottom = innerHeight - bar - (mobile() ? 170 : 150);
  return { cy: (top + bottom) / 2, H: Math.max(160, bottom - top), maxW: innerWidth * (mobile() ? .74 : .56) };
}
function sizeOf(p, m) {
  const ar = p.w && p.h ? p.w / p.h : 1.5;
  let h = m.H, w = h * ar;
  if (w > m.maxW) { w = m.maxW; h = w / ar; }
  return { w, h };
}
function makeCard(k) {
  const p = list[k];
  const el = document.createElement('div'); el.className = 'sc';
  el.innerHTML = '<div class="frame"><img alt="" draggable="false"></div>';
  const img = el.querySelector('img'); img.src = p.url; img.alt = p.name;
  if (colors.get(p.id)) el.style.setProperty('--c', colors.get(p.id));
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (el._k === idx) toggle(); else { show(el._k); wake(); }
  });
  el._k = k;
  return el;
}

function layout(instant) {
  const n = list.length, m = metrics();
  scene.style.top = m.cy + 'px';
  $('glow').style.top = m.cy + 'px';
  const L = Math.min(3, Math.floor((n - 1) / 2)), R = Math.min(3, n - 1 - L);
  const want = new Map();
  for (let d = -L; d <= R; d++) want.set((idx + d + n) % n, d);

  // Tính vị trí X theo kích thước thật của từng thẻ
  const sizes = new Map([...want].map(([k, d]) => [d, sizeOf(list[k], m)]));
  const xs = new Map([[0, 0]]);
  const spread = mobile() ? .2 : .3;
  for (const s of [1, -1]) {
    let x = 0, prevW = sizes.get(0).w;
    for (let a = 1; a <= 4; a++) {
      const cur = sizes.get(a * s) || sizes.get((a - 1) * s) || { w: prevW };
      x += a === 1 ? prevW / 2 + cur.w * spread + (mobile() ? 6 : 28) : prevW * spread + cur.w * spread;
      xs.set(a * s, x * s); prevW = cur.w;
    }
  }
  const place = (el, d, size) => {
    const a = Math.abs(d), s = Math.sign(d);
    el.style.width = size.w + 'px'; el.style.height = size.h + 'px';
    el.style.transform = `translate(-50%, -50%) translate3d(${xs.get(d) ?? s * innerWidth}px, 0, ${-a * 280}px) rotateY(${-s * (a ? 42 : 0)}deg)`;
    el.style.opacity = a >= 3 ? 0 : 1;
    el.style.setProperty('--br', [1, .5, .3, .2, .2][a]);
    el.style.setProperty('--sat', a ? .75 : 1);
    el.style.zIndex = 10 - a;
    el.classList.toggle('center', d === 0);
    el._d = d;
  };

  // Thẻ không còn trong khung nhìn: trượt ra xa rồi xoá
  for (const [k, el] of cards) {
    if (want.has(k)) continue;
    cards.delete(k);
    const d = el._d < 0 ? -4 : 4;
    place(el, d, sizeOf(list[k] || { w: 3, h: 2 }, m));
    setTimeout(() => el.remove(), MOVE_MS + 50);
  }
  // Thẻ mới: xuất hiện từ phía xa
  for (const [k, d] of want) {
    if (cards.has(k)) continue;
    const el = makeCard(k);
    el.classList.add('no-t');
    place(el, d === 0 ? 0 : (d < 0 ? d - 1 : d + 1), sizes.get(d));
    el.style.opacity = 0;
    scene.appendChild(el); cards.set(k, el);
    void el.offsetWidth; el.classList.remove('no-t');
  }
  for (const [k, d] of want) {
    const el = cards.get(k);
    if (instant) el.classList.add('no-t');
    place(el, d, sizes.get(d));
    if (instant) { void el.offsetWidth; el.classList.remove('no-t'); }
  }
}
function resetCards() { for (const el of cards.values()) el.remove(); cards.clear(); }

// ---------- Ken Burns trên ảnh ở giữa ----------
const MOVES = [
  ['scale(1.02)', 'scale(1.16) translate(0, -1.5%)'],
  ['scale(1.16) translate(0, 1%)', 'scale(1.03)'],
  ['scale(1.12) translate(-3%, 0)', 'scale(1.12) translate(3%, 0)'],
  ['scale(1.12) translate(3%, 0)', 'scale(1.12) translate(-3%, 0)'],
  ['scale(1.04) translate(2%, 2%)', 'scale(1.16) translate(-2%, -1%)'],
];
let kbAnim = null, kbImg = null, lastMove = -1;
function startKenBurns(img) {
  if (kbImg && kbAnim && kbImg !== img) {
    const cur = getComputedStyle(kbImg).transform;
    kbAnim.cancel();
    kbImg.animate([{ transform: cur === 'none' ? 'none' : cur }, { transform: 'scale(1)' }], { duration: MOVE_MS, easing: 'cubic-bezier(.7,0,.2,1)' });
  } else if (kbAnim) kbAnim.cancel();
  kbImg = img; kbAnim = null;
  if (reduceMotion) return;
  let m; do { m = Math.random() * MOVES.length | 0; } while (m === lastMove);
  lastMove = m;
  kbAnim = img.animate([{ transform: MOVES[m][0] }, { transform: MOVES[m][1] }],
    { duration: seconds * 1000 + MOVE_MS * 2, easing: 'linear', fill: 'forwards' });
  if (!playing) kbAnim.pause();
}

// ---------- Hiển thị một ảnh ----------
const bgs = [...document.querySelectorAll('.bgwrap i')];
let bgFront = 0, showToken = 0;
async function show(i, instant) {
  if (!list.length) return;
  idx = (i + list.length) % list.length;
  const p = list[idx], token = ++showToken;
  loading = true;
  await preload(p);
  if (token !== showToken) return; // người dùng đã bấm sang ảnh khác

  layout(instant);
  const el = cards.get(idx);
  el.classList.remove('shine'); void el.offsetWidth; el.classList.add('shine');
  startKenBurns(el.querySelector('img'));

  const back = bgs[1 - bgFront];
  back.style.backgroundImage = `url("${p.url}")`; back.classList.add('on'); bgs[bgFront].classList.remove('on'); bgFront = 1 - bgFront;
  const c = colors.get(p.id);
  if (c) { document.documentElement.style.setProperty('--amb', c); el.style.setProperty('--c', c); }

  setCaption(p);
  $('counter').innerHTML = `<b>${pad(idx + 1)}</b> — ${pad(list.length)}`;
  elapsed = 0; loading = false;
  preload(list[(idx + 1) % list.length]); preload(list[(idx - 1 + list.length) % list.length]);
}

function setCaption(p) {
  const d = new Date(when(p));
  const cap = $('cap'), title = $('title');
  cap.innerHTML = `<span class="mask"><span class="dm">${pad(d.getDate())}<em>.</em>${pad(d.getMonth() + 1)}</span></span>
    <span class="mask"><span class="yr"></span></span>`;
  cap.querySelector('.yr').textContent = `${d.getFullYear()} — ${fmtDay.format(d)}`;
  title.innerHTML = '';
  if (p.fav) title.insertAdjacentHTML('beforeend', '<span class="mask"><span class="fv">★ Yêu thích</span></span>');
  if (!boringName(p.name)) {
    const m = document.createElement('span'); m.className = 'mask';
    const s = document.createElement('span'); s.className = 'nm'; s.textContent = p.name.replace(/\.[^.]+$/, '');
    m.appendChild(s); title.appendChild(m);
  }
  for (const e of [cap, title]) { e.classList.remove('run'); void e.offsetWidth; e.classList.add('run'); }
}

// ---------- Vòng lặp thời gian ----------
function tick(t) {
  const dt = Math.min(t - lastT, 100); lastT = t;
  if (playing && !loading && list.length > 1) {
    elapsed += dt;
    if (elapsed >= seconds * 1000) show(idx + 1);
  }
  $('bar').style.transform = `scaleX(${list.length > 1 ? Math.min(elapsed / (seconds * 1000), 1) : 1})`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- Play / Pause ----------
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
function setPlaying(on, flash) {
  playing = on;
  $('playBtn').innerHTML = on ? ICON.pause : ICON.play;
  $('playBtn').setAttribute('aria-label', on ? 'Tạm dừng' : 'Phát');
  if (kbAnim) on ? kbAnim.play() : kbAnim.pause();
  const audio = $('audio');
  if (audio.src) on ? audio.play().catch(() => {}) : audio.pause();
  keepAwake(on);
  if (flash) {
    const pl = $('pulse'); pl.innerHTML = on ? ICON.play : ICON.pause;
    pl.classList.remove('show'); void pl.offsetWidth; pl.classList.add('show');
  }
  wake();
}
const toggle = () => setPlaying(!playing, true);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- Tự ẩn thanh điều khiển ----------
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (playing && started && !document.querySelector('.controls:hover')) document.body.classList.add('idle');
  }, 2600);
}
addEventListener('mousemove', wake);
addEventListener('touchstart', wake, { passive: true });

// ---------- Controls ----------
$('prevBtn').onclick = () => { show(idx - 1); wake(); };
$('nextBtn').onclick = () => { show(idx + 1); wake(); };
$('playBtn').onclick = toggle;

function refreshToggles() {
  $('shuffleBtn').classList.toggle('on', shuffle); $('shuffleBtn').setAttribute('aria-pressed', shuffle);
  $('favBtn').classList.toggle('on', favOnly); $('favBtn').setAttribute('aria-pressed', favOnly);
}
function rebuild() {
  const cur = list[idx]?.id;
  buildList(cur); resetCards(); show(idx, true);
  updateReel();
}
$('shuffleBtn').onclick = () => {
  shuffle = !shuffle; store.set('shuffle', shuffle); refreshToggles(); rebuild();
  toast(shuffle ? 'Trộn ngẫu nhiên: bật' : 'Theo thứ tự thời gian');
};
$('favBtn').onclick = () => {
  if (!favOnly && !all.some(p => p.fav)) { toast('Chưa có ảnh yêu thích nào'); return; }
  favOnly = !favOnly; store.set('fav', favOnly); refreshToggles(); rebuild();
  toast(favOnly ? `Chỉ ảnh yêu thích · ${list.length} ảnh` : `Tất cả · ${list.length} ảnh`);
};

$('speed').value = String(seconds);
if (!$('speed').value) { seconds = 5; $('speed').value = '5'; }
$('speed').onchange = () => { seconds = Number($('speed').value); store.set('speed', seconds); toast(`Mỗi ảnh ${seconds} giây`); };

// Nhạc nền: chọn file nhạc trong máy, chỉ phát tại chỗ, không tải lên server
$('musicBtn').onclick = () => {
  const audio = $('audio');
  if (audio.src) {
    audio.muted = !audio.muted;
    $('musicBtn').classList.toggle('on', !audio.muted);
    toast(audio.muted ? 'Đã tắt nhạc' : 'Đã bật nhạc');
  } else $('musicFile').click();
};
$('musicFile').onchange = () => {
  const f = $('musicFile').files[0]; if (!f) return;
  const audio = $('audio');
  audio.src = URL.createObjectURL(f); audio.volume = .8; audio.muted = false;
  $('musicBtn').classList.add('on'); $('musicBtn').title = 'Bật / tắt nhạc (M)';
  if (playing) audio.play().catch(() => {});
  toast('♪ ' + f.name.replace(/\.[^.]+$/, ''));
};

// Toàn màn hình
const fsEl = document.documentElement;
const canFs = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFs() {
  if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)?.call(fsEl)?.catch?.(() => {});
}
function refreshFs() { $('fsBtn').innerHTML = isFs() ? ICON.shrink : ICON.expand; }
if (!canFs) $('fsBtn').style.display = 'none';
$('fsBtn').onclick = toggleFs;
document.addEventListener('fullscreenchange', refreshFs);
document.addEventListener('webkitfullscreenchange', refreshFs);

// Vuốt để chuyển ảnh, bấm vào nền để dừng/phát
let touchX = null, touched = false;
addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touched = true; }, { passive: true });
addEventListener('touchend', e => {
  if (touchX === null || !started) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
  touchX = null;
});
document.addEventListener('click', e => {
  if (!started || e.target.closest('.controls, .top, .intro')) return;
  if (touched) { touched = false; return; } // trên điện thoại chạm chỉ hiện thanh điều khiển
  toggle();
});

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (!started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } return; }
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'k') { e.preventDefault(); toggle(); }
  else if (k === 'arrowright' || k === 'l') { show(idx + 1); wake(); }
  else if (k === 'arrowleft' || k === 'j') { show(idx - 1); wake(); }
  else if (k === 'f') toggleFs();
  else if (k === 'm') $('musicBtn').click();
  else if (k === 's') $('shuffleBtn').click();
  else if (k === 'escape' && !isFs()) location.href = '/';
});

let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => started && layout(true), 120); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && playing) keepAwake(true);
});

// ---------- Intro & khởi động ----------
function updateReel() {
  if (!list.length) return;
  const ys = list.map(p => new Date(when(p)).getFullYear());
  const a = Math.min(...ys), b = Math.max(...ys);
  const range = a === b ? `${a}` : `${a} — ${b}`;
  $('reel').innerHTML = `Kỷ niệm · <b>${range}</b>`;
  return range;
}
function buildWall() {
  const src = list.slice(0, 18); if (!src.length) return;
  const cols = mobile() ? 4 : 6, per = 8;
  let html = '';
  for (let c = 0; c < cols; c++) {
    let col = '';
    for (let r = 0; r < per; r++) col += `<img alt="" src="${src[(c * 3 + r * 5) % src.length].url}">`;
    html += `<div class="col">${col}${col}</div>`; // lặp 2 lần để cuộn vô tận
  }
  $('wall').innerHTML = html;
}

async function start() {
  if (started || !list.length) return;
  started = true;
  if (canFs && !mobile()) toggleFs();
  $('intro').classList.add('leave');
  document.body.classList.remove('intro-on');
  await show(idx, true);
  setTimeout(() => scene.classList.remove('pre'), 350);
  setTimeout(() => { $('intro').remove(); }, 2000);
  setPlaying(true);
}
$('startBtn').onclick = start;

(async () => {
  refreshToggles(); refreshFs();
  $('playBtn').innerHTML = ICON.play;
  try {
    const res = await fetch('/api/photos');
    if (res.status === 401) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
    if (!res.ok) throw new Error();
    all = await res.json();
  } catch {
    $('introText').innerHTML = 'Không kết nối được server.<br>Hãy chạy <b>node server.js</b> rồi tải lại trang.';
    return;
  }
  if (favOnly && !all.some(p => p.fav)) { favOnly = false; refreshToggles(); }
  buildList(params.get('start'));
  if (!list.length) {
    $('introText').innerHTML = 'Chưa có ảnh nào để trình chiếu — <a href="/">tải ảnh lên gallery</a> trước nhé.';
    return;
  }
  const range = updateReel();
  $('introText').textContent = `${list.length} khoảnh khắc · ${range}`;
  buildWall();
  preload(list[idx]).then(() => {
    if (!started && colors.get(list[idx].id)) document.documentElement.style.setProperty('--amb', colors.get(list[idx].id));
  });
  $('startBtn').disabled = false;
  $('startBtn').focus({ preventScroll: true });
  // Mở từ nút "trình chiếu từ ảnh này" thì vào thẳng
  if (params.get('start')) start();
})();
</script>
